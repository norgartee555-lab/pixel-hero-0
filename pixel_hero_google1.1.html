:root{--u:2;--ink:#7a4a30;--cream:#e8cfa6;--tan:#dcb98a;--deep:#a8744a;--bg:#3a2a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:700px){:root{--u:3}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:#1d1030;color:var(--ink);font:14px/1 Sprout,ui-monospace,monospace;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-font-smoothing:none}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated}
.pl{--n:var(--wd1n);--p:var(--wd2p);border:solid transparent;border-width:10px 12px 14px;border-image:var(--n) 5 6 7 6 fill/10px 12px 14px 12px;image-rendering:pixelated;color:var(--ink);font:inherit;background:none;padding:0 2px;cursor:pointer;white-space:nowrap}
.pl.on,.pl:active{border-image-source:var(--p);transform:translateY(2px)}
.plate{}
#chips{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:0;padding:0 6px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
#chips .pl{flex:none;font-size:14px}

async function makeAdapter(fb,cfg){
 const app=fb.initializeApp(cfg),auth=fb.getAuth(app),db=fb.getDatabase(app);
 let user=await new Promise(r=>{const off=fb.onAuthStateChanged(auth,u=>{off();r(u)})});

   fb.onValue(fb.ref(db,'rooms/main/peers'),snap=>{const v=snap.val()||{},peers=[],left=[];for(const id in v){let p={};try{p=JSON.parse(v[id].j)||{}}catch(e){}peers.push({peer:id,isMe:id==tab,kind:'viewer',presence:p})}for(const id in prev)if(!(id in v))left.push({peer:id});prev=v;cb({peers,joined:[],left,updated:[]})},e=>errcb&&errcb(e))})();return()=>{}}};

function vars(F,s){s=s||new Set();if(F[0]=='v')s.add(F[1]);else if(F.length>1)F.slice(1).forEach(x=>vars(x,s));return s}
